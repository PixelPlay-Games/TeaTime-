<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TeaTime Могилев — Свежий китайский чай</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg: #0e1c14;
      --card: #172b20;
      --card-light: #203b2c;
      --card-border: rgba(168, 240, 90, 0.16);
      --neon: #7bed9f;
      --accent-bright: #a8f05a;
      --neon-glow: rgba(123, 237, 159, 0.28);
      --text: #f1f8f4;
      --muted: #a3c2b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #12241a 0%, var(--bg) 100%);
      color: var(--text);
      padding: 14px 14px 98px;
      min-height: 100vh;
    }

    /* Верхняя панель профиля */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 10px 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-bright), var(--neon));
      color: #0e1c14;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .user-name {
      font-weight: 700;
      font-size: 14px;
    }

    .user-lvl {
      font-size: 11px;
      color: var(--neon);
    }

    .city-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--card-light);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 12px;
      color: #e2f5ea;
    }

    /* Главный баннер */
    .hero-card {
      position: relative;
      background: radial-gradient(circle at 85% 25%, rgba(168, 240, 90, 0.22), transparent 60%),
                  linear-gradient(145deg, #1d3628, #14261c);
      border: 1px solid rgba(168, 240, 90, 0.25);
      border-radius: 24px;
      padding: 22px 18px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .hero-tag {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--accent-bright);
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .hero-title {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 8px;
      max-width: 78%;
      color: #ffffff;
    }

    .hero-desc {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
      max-width: 76%;
      line-height: 1.45;
    }

    .hero-emoji {
      position: absolute;
      right: 14px;
      top: 26px;
      font-size: 62px;
      filter: drop-shadow(0 0 18px var(--neon-glow));
    }

    .btn-neon {
      width: 100%;
      background: linear-gradient(90deg, var(--accent-bright), var(--neon));
      color: #0b1911;
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 18px var(--neon-glow);
      cursor: pointer;
    }

    .btn-neon:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Сетка плиток на главной */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .tile {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 136px;
    }

    .tile-title {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #e8f7ee;
    }

    .tile-sub {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .btn-dark {
      width: 100%;
      background: var(--card-light);
      color: #e2f5ea;
      border: 1px solid rgba(123, 237, 159, 0.25);
      border-radius: 12px;
      padding: 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }

    /* Вкладки контента */
    .tab-section {
      display: none;
    }
    .tab-section.active {
      display: block;
    }

    /* Горизонтальный скролл категорий (блоков) */
    .cat-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .cat-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--muted);
      padding: 9px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-btn.active {
      background: linear-gradient(90deg, var(--accent-bright), var(--neon));
      color: #0e1c14;
      border-color: transparent;
      font-weight: 800;
    }

    .block-heading {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-bright);
      margin: 16px 0 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Карточки напитков */
    .drink-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .drink-header {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .drink-img-box {
      width: 74px;
      height: 86px;
      border-radius: 16px;
      background: radial-gradient(circle, rgba(168, 240, 90, 0.2) 0%, rgba(14, 28, 20, 0.6) 100%);
      border: 1px solid rgba(168, 240, 90, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .drink-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
    }

    .drink-info {
      flex: 1;
    }

    .drink-name {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    .drink-comp {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.35;
    }

    .drink-price {
      font-size: 16px;
      font-weight: 900;
      color: var(--accent-bright);
      margin-top: 6px;
    }

    /* Переключатели опций */
    .opt-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.4px;
    }

    .opt-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .opt-btn {
      flex: 1;
      min-width: fit-content;
      padding: 7px 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #112218;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .opt-btn.active {
      background: rgba(123, 237, 159, 0.22);
      border-color: var(--neon);
      color: #ffffff;
    }

    .opt-btn.fixed {
      background: rgba(168, 240, 90, 0.12);
      border-color: rgba(168, 240, 90, 0.35);
      color: var(--accent-bright);
      cursor: default;
    }

    /* Поля в корзине */
    .form-input {
      width: 100%;
      background: #112218;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 11px 12px;
      color: #ffffff;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }

    .form-input::placeholder {
      color: #6f9480;
    }

    /* Плавающее нижнее меню */
    .bottom-nav {
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      background: rgba(23, 43, 32, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(168, 240, 90, 0.25);
      border-radius: 22px;
      display: flex;
      justify-content: space-around;
      padding: 10px 6px;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }

    .nav-item.active {
      color: var(--accent-bright);
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -6px;
      background: var(--accent-bright);
      color: #0e1c14;
      font-size: 10px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- Верхняя панель профиля -->
  <div class="top-bar">
    <div class="user-info">
      <div class="avatar" id="userAvatar">T</div>
      <div>
        <div class="user-name" id="userName">Гость TeaTime</div>
        <div class="user-lvl">Чайный бар • Ленинская 45</div>
      </div>
    </div>
    <div class="city-pill">
      <span>📍 Могилев</span>
    </div>
  </div>

  <!-- ВКЛАДКА 1: ГЛАВНАЯ -->
  <div id="tab-home" class="tab-section active">
    <div class="hero-card">
